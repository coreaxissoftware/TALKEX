<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <!--
    No script-src injection surface beyond our own bundle: blocks inline
    <script> and any third-party script/plugin from ever running, which is
    the actual backstop an XSS finding like an unvalidated href scheme
    (see join_url in ChatView.jsx) has nothing to fall back on without.
    connect-src is scoped to the real API origin (VITE_API_URL) plus the
    STUN lookup WebRTC calling needs — not to `*`, or this would stop being
    a backstop against a script trying to exfiltrate data anywhere else.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    worker-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https://talkex-backend.onrender.com https://*.tile.openstreetmap.org https://*.mzstatic.com;
    media-src 'self' blob: https://talkex-backend.onrender.com https://audio-ssl.itunes.apple.com;
    font-src 'self';
    connect-src 'self' blob: https://talkex-backend.onrender.com wss://talkex-backend.onrender.com http://localhost:8090 ws://localhost:8090 stun: turn:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
  "/>
  <title>TalkEx ⚡</title>
  <meta name="description" content="TalkEx — Chat • Meetings • Business • Automation"/>
  <link rel="icon" href="/icon.png?v=2"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icon.png?v=2"/>
  <meta name="theme-color" content="#2563eb"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="TalkEx"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    /* Every button/tab/option/label in this app is a plain <div onClick>,
       not a semantic <button> — there's no single CSS class to scope
       "interactive chrome" to, so the only reliable fix is disabling
       selection app-wide and re-enabling it only where it's actually
       wanted (below). Without this, a long-press on ANY of that div-chrome
       (a tab label, a menu option, a filter pill) triggered the OS's
       native text-selection/callout instead of the app's own long-press
       handler — the same conflict a long-press on a message bubble would
       have caused too, except message bubbles never needed native
       selection in the first place: copying a message already goes
       through the app's own long-press → context menu → Copy action
       (see ChatView's MessageMenu), which native selection only ever
       fights with, never helps. */
    *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
    /* The one place selection has to keep working: whatever the person
       is actually typing (composer, search boxes, every text/number
       field, textareas). */
    input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;}
    /* Lock the document itself so the page can NEVER scroll. Without this, iOS
       Safari scrolls the whole document up when the keyboard opens to reveal a
       focused input — dragging the header off the top and the composer out of
       view (the app-height sizing below already keeps everything above the
       keyboard, so the browser's own scroll only broke the layout). Every real
       scroll happens inside the app's own flex:1/overflowY:auto panes instead. */
    html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
    #root{height:100%;}
    body{background:#f5f9fc;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
      /* The iOS/native system font stack app-wide — renders as San Francisco
         on Apple, Roboto on Android, Segoe on Windows, instead of the
         browser default that made everything look slightly "web" rather than
         "app". This single line is one of the biggest cheap wins for the
         premium feel. */
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
      letter-spacing:-0.01em;}
    button,input,textarea,select{font-family:inherit;}
    button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
    button:active{transform:scale(0.97);transition:transform 0.08s ease-out;}
    img,video{-webkit-user-drag:none;user-select:none;}
    /* Thin scrollbars everywhere — Firefox via scrollbar-width, everything
       else (Chrome/Safari/Edge) via the ::-webkit-scrollbar pseudo-elements. */
    *{scrollbar-width:thin;scrollbar-color:#8884 transparent;}
    ::-webkit-scrollbar{width:1px;height:1px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#88888844;border-radius:10px;}
    ::-webkit-scrollbar-thumb:hover{background:#88888888;}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    /* --- Premium motion vocabulary (used across chat bubbles, reactions,
       sheets, list rows). A spring-ish overshoot easing is what separates an
       "app" feel from a linear web transition. --- */
    /* A freshly-sent/received message settling into place: rises a touch,
       scales up from 96%, fades in — one quick spring, plays once per
       message on mount (keyed elements never remount, so history never
       re-animates). Own vs received lean in from their own side. */
    @keyframes msgInRight{from{opacity:0;transform:translateY(8px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes msgInLeft{from{opacity:0;transform:translateY(8px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    /* Reaction/badge pop — overshoots past 1 then settles, the tactile
       "boop" a reaction should have. */
    @keyframes popIn{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
    /* Generic spring rise for cards/rows/sheets. */
    @keyframes springUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    /* A soft pulse for skeleton/loading placeholders. */
    @keyframes shimmer{0%{opacity:0.5}50%{opacity:1}100%{opacity:0.5}}
    /* Press-scale for any element tagged data-press — a unified tap-feedback
       so a plain <div onClick> gets the same 0.96 squish a <button> already
       gets above, without every call site re-implementing it. */
    [data-press]{transition:transform 0.1s cubic-bezier(0.34,1.56,0.64,1);}
    [data-press]:active{transform:scale(0.95);}
  </style>
  <script src="/theme-init.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
