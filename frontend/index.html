<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <!--
    No script-src injection surface beyond our own bundle: blocks inline
    <script> and any third-party script/plugin from ever running, which is
    the actual backstop an XSS finding like an unvalidated href scheme
    (see join_url in ChatView.jsx) has nothing to fall back on without.
    connect-src is scoped to the real API origin (VITE_API_URL) plus the
    STUN lookup WebRTC calling needs — not to `*`, or this would stop being
    a backstop against a script trying to exfiltrate data anywhere else.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    worker-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https://talkex-backend.onrender.com https://*.tile.openstreetmap.org https://*.mzstatic.com;
    media-src 'self' blob: https://talkex-backend.onrender.com https://audio-ssl.itunes.apple.com;
    font-src 'self';
    connect-src 'self' blob: https://talkex-backend.onrender.com wss://talkex-backend.onrender.com http://localhost:8090 ws://localhost:8090 stun: turn:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
  "/>
  <title>TalkEx ⚡</title>
  <meta name="description" content="TalkEx — Chat • Meetings • Business • Automation"/>
  <link rel="icon" href="/icon.png?v=2"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icon.png?v=2"/>
  <meta name="theme-color" content="#2563eb"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="TalkEx"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    /* Lock the document itself so the page can NEVER scroll. Without this, iOS
       Safari scrolls the whole document up when the keyboard opens to reveal a
       focused input — dragging the header off the top and the composer out of
       view (the app-height sizing below already keeps everything above the
       keyboard, so the browser's own scroll only broke the layout). Every real
       scroll happens inside the app's own flex:1/overflowY:auto panes instead. */
    html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
    #root{height:100%;}
    body{background:#f5f9fc;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
    button,input,textarea,select{font-family:inherit;}
    button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
    button:active{transform:scale(0.97);transition:transform 0.08s ease-out;}
    img,video{-webkit-user-drag:none;user-select:none;}
    /* Thin scrollbars everywhere — Firefox via scrollbar-width, everything
       else (Chrome/Safari/Edge) via the ::-webkit-scrollbar pseudo-elements. */
    *{scrollbar-width:thin;scrollbar-color:#8884 transparent;}
    ::-webkit-scrollbar{width:1px;height:1px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#88888844;border-radius:10px;}
    ::-webkit-scrollbar-thumb:hover{background:#88888888;}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  </style>
  <script src="/theme-init.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
