# web.talkex.in — the React/Vite PWA served as static files (SPA)
# DRAFT — isolated vhost. Place at /etc/nginx/sites-available/talkex-web.conf, symlink, nginx -t, reload.
# certbot --nginx fills in the ssl_certificate lines.

server {
    listen 80;
    listen [::]:80;
    server_name web.talkex.in;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name web.talkex.in;

    # ssl_certificate     /etc/letsencrypt/live/web.talkex.in/fullchain.pem;   # certbot
    # ssl_certificate_key /etc/letsencrypt/live/web.talkex.in/privkey.pem;     # certbot

    root <WEB_ROOT>;            # e.g. /var/www/talkex/web  (contents of frontend/dist)
    index index.html;

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app shell and the service worker must NEVER be cached long, or clients
    # get stuck on an old build. (The SW itself also does runtime caching.)
    location = /service-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html        { add_header Cache-Control "no-cache"; }
    location = /manifest.json     { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # SPA fallback — any unknown path serves index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
