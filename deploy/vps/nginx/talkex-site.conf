# talkex.in (apex) + www — the static marketing site
# DRAFT — isolated vhost. Place at /etc/nginx/sites-available/talkex-site.conf, symlink, nginx -t, reload.
# certbot --nginx fills in the ssl_certificate lines.
#
# NOTE: the marketing build ships an Apache `.htaccess` (for Hostinger). nginx
# ignores .htaccess — the equivalent rewrite is the SPA-style try_files fallback
# below. Confirm the marketing site's routing needs; a plain single-page site
# only needs the fallback to index.html.

server {
    listen 80;
    listen [::]:80;
    server_name talkex.in www.talkex.in;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.talkex.in;
    # ssl_certificate     /etc/letsencrypt/live/talkex.in/fullchain.pem;   # certbot
    # ssl_certificate_key /etc/letsencrypt/live/talkex.in/privkey.pem;     # certbot
    # Canonicalise www -> apex.
    return 301 https://talkex.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name talkex.in;

    # ssl_certificate     /etc/letsencrypt/live/talkex.in/fullchain.pem;   # certbot
    # ssl_certificate_key /etc/letsencrypt/live/talkex.in/privkey.pem;     # certbot

    root <SITE_ROOT>;          # e.g. /var/www/talkex/site  (contents of website/deploy)
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
