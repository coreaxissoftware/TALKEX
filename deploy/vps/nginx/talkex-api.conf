# api.talkex.in — reverse proxy to the FastAPI/uvicorn backend (HTTP + WebSocket)
# DRAFT — isolated vhost for TalkEx only. Place at:
#   /etc/nginx/sites-available/talkex-api.conf
#   ln -s ../sites-available/talkex-api.conf /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# The 443 ssl_certificate lines are added automatically by `certbot --nginx`.
# Until certs exist, run certbot (it edits THIS file's server block only).

# --- HTTP: redirect to HTTPS (certbot also manages this once run) ---
server {
    listen 80;
    listen [::]:80;
    server_name api.talkex.in;
    # Allow Let's Encrypt HTTP-01 challenge, redirect everything else.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.talkex.in;

    # ssl_certificate / ssl_certificate_key: filled in by certbot --nginx
    # ssl_certificate     /etc/letsencrypt/live/api.talkex.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.talkex.in/privkey.pem;

    # Uploads can be large — must be >= backend MAX_ATTACHMENT_BYTES.
    client_max_body_size 256m;

    # Long-lived WebSocket connections (presence, calls signalling, live chat).
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location / {
        proxy_pass http://127.0.0.1:<BACKEND_PORT>;   # e.g. 8100
        proxy_http_version 1.1;

        # WebSocket upgrade (wss://api.talkex.in/...).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Real client info for the app + rate limiting/logging.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't buffer big uploads to disk before forwarding.
        proxy_request_buffering off;
    }
}

# NOTE: add this map ONCE, globally (e.g. /etc/nginx/conf.d/websocket-upgrade.conf)
# if it isn't already defined by another project. It maps the Upgrade header so
# WebSockets proxy correctly. If a global one already exists, DO NOT duplicate it.
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
