services:
  - type: web
    name: talkex-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /data
      # Without this, CORSMiddleware falls back to localhost-only dev
      # origins and every request from the real frontend domain gets
      # rejected by the browser before the API ever runs. Set to the
      # actual frontend origin(s), comma-separated, no trailing slash.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # The one account whose username (case-insensitive) is promoted to
      # superadmin the first time it signs in — with no value set here,
      # a fresh deploy has no way for anyone to ever reach /admin/*.
      - key: SUPERADMIN_USERNAME
        sync: false
      # The phone number of the TalkEx Admin account — auto-sends a
      # welcome DM to every new user and owns the announcement channel.
      - key: ADMIN_PHONE
        value: "9113107586"
      # SMS/email OTP delivery is silently a no-op (console-log fallback)
      # until these are set, either here or later via the superadmin
      # Integrations panel. Declared here so a fresh deploy shows them as
      # required instead of failing invisibly.
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      # Native Android push (FCM) is silently a no-op — every send just
      # returns "error" with nothing surfaced to the user — until this is
      # set. Paste the WHOLE Firebase service-account JSON file's contents
      # as this value (Firebase console → Project settings → Service
      # accounts → Generate new private key). Web push (browser/PWA) does
      # not need this; it uses the separate VAPID keypair in push.py,
      # generated automatically on first run.
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      # Optional: the composer's GIF picker (Tenor). Absent, GET
      # /api/gifs/search just answers 503 — nothing else is affected.
      - key: TENOR_API_KEY
        sync: false
      # Optional: inline "Translate" on a received message (Google Cloud
      # Translate). Absent, GET /api/translate just answers 503.
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      # Optional: LiveKit SFU for scalable group calls. Without these,
      # group calls use the built-in peer-to-peer mesh.
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
    healthCheckPath: /health
    disk:
      name: talkex-data
      mountPath: /data
      sizeGB: 1
