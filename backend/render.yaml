services:
  - type: web
    name: talkex-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /data
    healthCheckPath: /health
    disk:
      name: talkex-data
      mountPath: /data
      sizeGB: 1
